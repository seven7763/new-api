# DaoXE documentation site (prerendered static site) + optional assistant proxy.
# Serves the pre-built Vite bundle from /var/www/daoxe-docs with SPA fallback,
# and reverse-proxies /docs-api/assistant/* to a local Bun sidecar that holds
# DOCS_ASSISTANT_KEY (never exposed to browsers).
#
# Sidecar: DOCS_ASSISTANT_KEY=sk-... bun server/assistant-proxy.ts  (port 8788)
# This block only ADDS /docs and /docs-api handling; it does NOT modify the
# existing location /, /v1 API routes, TLS, or CORS.
#
# NO `add_header` ANYWHERE IN THIS FILE — deliberately. deploy/add_docs_include.py
# drops this snippet inside an existing HTTPS `server {}` block that also serves
# the AI gateway, the console and payment pages, and whose own headers we cannot
# see. nginx inherits `add_header` by REPLACEMENT: one add_header at a level
# discards every add_header from the enclosing levels. A single
# `add_header Cache-Control ...` in a /docs location therefore strips whatever
# that vhost sets — HSTS, CSP, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy — from every /docs response, and these pages render
# operator-configured announcement and footer HTML.
#
# So cache policy is expressed with `expires`, which is a separate directive
# with ordinary inheritance: it leaves the parent's header set untouched at
# every level. Cost of that choice: `expires` can only emit `Cache-Control:
# no-cache | max-age=N`, so the `public`, `must-revalidate` and `immutable`
# keywords are gone. Behaviourally `no-cache` still forces revalidation of every
# HTML response, and hashed asset URLs change on every deploy, so `immutable`
# only ever saved a conditional request on a manual reload. Re-declaring a
# guessed security header set here would be worse: a made-up HSTS max-age
# overwrites the host's real policy on every docs hit, and a made-up CSP breaks
# the inline theme script and the assistant.
#
# Run `nginx -t` after replacing this file, then `nginx -s reload`.

# Canonicalize bare mount points to their trailing-slash form. Exact-match
# locations are evaluated before the `^~ /docs/` prefix below, which is why the
# per-language ones cannot be folded into a regex there.
#
# `expires -1` on each: without it these four 301s are the only docs redirects
# with no freshness header at all, so browsers apply the heuristic for a
# permanent redirect and pin them indefinitely, while the nine `rewrite …
# permanent` rules inside `^~ /docs/` do carry one. Every docs redirect now
# revalidates, and none of them can outlive a change to this file.
location = /docs {
    expires -1;
    return 301 /docs/;
}
location = /docs/en {
    expires -1;
    return 301 /docs/en/;
}
location = /docs/ru {
    expires -1;
    return 301 /docs/ru/;
}
location = /docs/vi {
    expires -1;
    return 301 /docs/vi/;
}

# Docs assistant proxy (server-held key). Prefer longer prefix match.
location ^~ /docs-api/assistant/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
}

# Hashed build output — the filename changes whenever the bytes do.
location ^~ /docs/assets/ {
    alias /var/www/daoxe-docs/assets/;
    expires 1y;
    access_log off;
}

# Screenshots and other public/ media. Stable names, so a week of caching with
# revalidation afterwards; a replaced screenshot appears within that window.
location ^~ /docs/images/ {
    alias /var/www/daoxe-docs/images/;
    expires 7d;
    access_log off;
}

# Prerendered HTML + SPA history fallback. `alias` maps /docs/<x> to the docs
# root. Every page exists as <route>/index.html for all four languages, so the
# usual request is answered by a static file with the right <title>, canonical,
# hreflang and body; only unknown URLs reach the SPA shell.
location ^~ /docs/ {
    alias /var/www/daoxe-docs/;
    index index.html;

    # HTML is rewritten by every deploy and must never be served stale, but the
    # bodies are identical across deploys often enough that revalidation is
    # cheap (nginx answers 304 from ETag/Last-Modified).
    expires -1;

    # zh is the default language and keeps prefix-free URLs, so /docs/zh/... is
    # a duplicate spelling. Fold it onto the canonical one before anything else
    # can serve it. Cannot loop: the target has no language prefix.
    rewrite ^/docs/zh(?:/(.*))?$                       /docs/$1                 permanent;

    # Legacy multi-page docs (the pre-SPA build kept in docs-site/_legacy_html)
    # used /docs/pages/<group>/<name>.html. Those URLs may still be indexed or
    # linked, and the SPA fallback would answer them with a soft-404, so map
    # them onto the equivalent SPA route. Specific rules first: `permanent`
    # stops rewrite processing.
    rewrite ^/docs/pages/changelog/index\.html$        /docs/changelog          permanent;
    rewrite ^/docs/pages/features/pricing-page\.html$  /docs/features/pricing   permanent;
    rewrite ^/docs/pages/([a-z0-9-]+)/([a-z0-9-]+)\.html$  /docs/$1/$2          permanent;

    # `<route>/index.html` is the file on disk, so nginx answers it with the
    # right page — but the browser keeps that spelling, the app resolves no such
    # route and replaces the article it just received with the index page. One
    # canonical spelling instead. MUST stay below the pages/ rules above, which
    # own /docs/pages/changelog/index.html. `(?:(.+)/)?` drops the directory
    # slash with the filename, so this lands on /docs/en/guide/keys directly
    # rather than bouncing through the trailing-slash rule below; a bare
    # /docs/en/index.html still resolves to the language root /docs/en/.
    rewrite ^/docs/((?:en|ru|vi)/)?(?:(.+)/)?index\.html$  /docs/$1$2           permanent;

    # Sidebar group ids are not routes: /docs/guide only exists as a heading.
    # The history fallback would answer them 200 with the SPA shell, so send
    # each one to the group's first page. Generated from groupEntryPath() in
    # src/config.ts and asserted by scripts/verify-prerender.ts, which fails the
    # build if a group is renamed, reordered or added without updating these.
    # `changelog` is absent on purpose — it is a real route.
    rewrite ^/docs/((?:en|ru|vi)/)?start/?$            /docs/$1                 permanent;
    rewrite ^/docs/((?:en|ru|vi)/)?guide/?$            /docs/$1guide/register   permanent;
    rewrite ^/docs/((?:en|ru|vi)/)?api/?$              /docs/$1api/auth         permanent;
    rewrite ^/docs/((?:en|ru|vi)/)?billing/?$          /docs/$1billing/rules    permanent;
    rewrite ^/docs/((?:en|ru|vi)/)?features/?$         /docs/$1features/wallet  permanent;
    rewrite ^/docs/((?:en|ru|vi)/)?support/?$          /docs/$1support/faq      permanent;
    rewrite ^/docs/((?:en|ru|vi)/)?legal/?$            /docs/$1legal/terms      permanent;

    # A trailing slash makes a second crawlable URL for every page (the sitemap
    # and every canonical spell them without one). Folding it needs two rules,
    # not one: `^/docs/((?:en|ru|vi)/)?(.+?)/+$` looks safe but backtracks —
    # given /docs/en/ the optional group gives up its match, `(.+?)` takes "en"
    # and the rule 301s to /docs/en, which `location = /docs/en` 301s straight
    # back. Making the language segment mandatory in one rule and excluding it
    # by lookahead in the other leaves the four language roots untouched.
    # Below the group rules above so /docs/guide/ lands on its page in one hop.
    rewrite ^/docs/(en|ru|vi)/(.+?)/+$                 /docs/$1/$2              permanent;
    rewrite ^/docs/(?!en/|ru/|vi/)(.+?)/+$             /docs/$1                 permanent;

    # $uri/index.html is an explicit file test, so extensionless routes are
    # served straight from disk with no directory-index round trip. app.html is
    # the empty (noindex) shell React boots into when nothing matched — as a
    # non-final parameter it is a file test, so a deploy that never copied it
    # (an interrupted rsync) answers 404. As the final parameter it was an
    # internal redirect back into this same location, which re-ran try_files
    # until nginx gave up and returned 500.
    try_files $uri $uri/index.html /docs/app.html =404;
    access_log off;
}
