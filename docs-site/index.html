    <script>
      (function () {
        var t
        try {
          var m = document.cookie.match(/(?:^|;\s*)vite-ui-theme=([^;]*)/)
          t = m ? decodeURIComponent(m[1]) : localStorage.getItem('vite-ui-theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'system'
        var dark =
          t === 'dark' ||
          (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
